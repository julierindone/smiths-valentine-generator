<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda+SC:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="reset.css">
	<link rel="stylesheet" href="style.css">
	<title>It's not like any other love</title>
</head>

<body class="noto-sans fair-girls" aria-label="Image of four girls at a fair - Jürgen Vollmer, 'Rock 'N' Roll Times: The Style and Spirit of the Early Beatles and Their First Fans'">
	<header id="header">
		<div class="bodoni-moda-sc color-band">
			<h1>Not Like Any Other Love</h1>
			<p class="subheading noto-sans">A Smiths & Morrissey Valentine Generator</p>
		</div>
	</header>
	<main>
		<div class="inner-main-wrapper">
			<div class="pointless-button-container">
				<button type="submit" id="submit-btn">generate valentine!</button>
			</div>
			<div id="valentine-container">
			</div>
		</div>
		<footer id="footer">
			<p class="note">* I didn't have time to make this copyable,
				<br>but surely you know how to take a screenshot and crop it.
			</p>
			<hr class="footer-top-line">
			<hr class="footer-bottom-line">
			<div class="footer-text-div">
				<p>
					All lyrics credited to The&nbsp;Smiths and/or Morrissey.
				</p>
				<a href="https://lorem-smithsum.netlify.app/">Generate some Smiths lorem ipsum text here.</a>
			</div>
		</footer>
	</main>
	<script src="index.js" type="module"></script>
</body>

</html>
